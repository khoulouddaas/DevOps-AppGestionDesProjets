route:
  receiver: 'webhook'
  group_by: ['alertname', 'tier']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: 'webhook'
    webhook_configs:
      # Va sur https://webhook.site, copie ton URL unique et remplace-la ici
      - url: 'https://webhook.site/REMPLACE-PAR-TON-ID'
        send_resolved: true
