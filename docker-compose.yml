services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devops-network

  backend:
    build: ./backend
    image: khouloud04/devops-backend:latest
    container_name: backend-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "9091:8080"
    networks:
      - devops-network

  frontend:
    build: ./frontend
    image: khouloud04/devops-frontend:latest
    container_name: frontend-app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - devops-network

  adminer:
    image: adminer
    container_name: adminer-ui
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    networks:
      - devops-network

volumes:
  mysql_data:

networks:
  devops-network:
    driver: bridge